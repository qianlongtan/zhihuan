<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知幻 · PDF 划词翻译</title>
  <link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ───────────────────────── 顶栏 ───────────────────────── -->
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
      <rect x="2.5" y="1.5" width="11" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M14 9.5l3.5 3.5-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    </svg>
    <span class="brand-name">知幻</span>
    <span class="brand-sub">PDF 划词翻译</span>
  </div>

  <button class="tb-btn" id="btnOpen" title="打开 PDF（Ctrl+O）">
    <span class="ic" data-icon="folder"></span><span class="tb-label">打开</span>
  </button>
  <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>

  <button class="tb-btn" id="btnSave" title="保存标注到 PDF（Ctrl+S）">
    <span class="ic" data-icon="save"></span><span class="tb-label">保存</span>
    <span class="save-dot" id="saveDot" hidden aria-label="有未保存改动"></span>
  </button>

  <div class="tb-sep"></div>

  <div class="page-nav" title="页码跳转">
    <input type="number" id="pageInput" min="1" value="1" aria-label="当前页">
    <span class="page-total" id="pageTotal">/ –</span>
  </div>

  <div class="zoom-ctl" title="缩放（Ctrl+滚轮）">
    <button class="tb-btn icon-only" id="zoomOut" aria-label="缩小"><span class="ic" data-icon="minus"></span></button>
    <button class="tb-btn zoom-val" id="zoomReset" title="重置为 100%">100%</button>
    <button class="tb-btn icon-only" id="zoomIn" aria-label="放大"><span class="ic" data-icon="plus"></span></button>
  </div>

  <div class="tb-spacer"></div>

  <label class="tb-select" title="翻译服务商">
    <span class="tb-select-label">服务</span>
    <span class="select-wrap">
      <span class="prov-dot" id="provDot" data-state="unknown"></span>
      <select id="providerSel"></select>
      <span class="select-caret ic" data-icon="chevronDown"></span>
    </span>
  </label>

  <label class="tb-select" title="目标语言">
    <span class="tb-select-label">译为</span>
    <span class="select-wrap">
      <select id="langSel"></select>
      <span class="select-caret ic" data-icon="chevronDown"></span>
    </span>
  </label>

  <button class="toggle" id="autoToggle" role="switch" aria-checked="true" title="划词后自动翻译">
    <span class="toggle-track"><span class="toggle-thumb"></span></span>
    <span class="toggle-text">自动</span>
  </button>

  <button class="tb-btn icon-only" id="btnSettings" aria-label="设置" title="设置"><span class="ic" data-icon="gear"></span></button>
</header>

<!-- ───────────────────────── 主体 ───────────────────────── -->
<main class="workspace">

  <!-- 左：阅读区 -->
  <section class="reader" id="reader">
    <div class="empty" id="empty">
      <div class="empty-inner">
        <svg viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 6h16l8 8v28H12z"/>
          <path d="M28 6v8h8"/>
          <path d="M18 24h12M18 30h12M18 36h7"/>
          <path d="M34 32v10M29 37h10" stroke-dasharray="2.5 3"/>
        </svg>
        <p class="empty-title">把 PDF 拖到这里</p>
        <p class="empty-sub">支持双栏论文 · 选中文字即翻译</p>
        <button class="btn primary" id="btnPick">选择 PDF 文件</button>
        <p class="empty-hint">或按 <kbd>Ctrl</kbd>+<kbd>O</kbd> 打开</p>
      </div>
    </div>
    <div class="pages" id="pages" hidden></div>
  </section>

  <!-- 分割条 -->
  <div class="splitter" id="splitter" title="拖拽调整面板宽度（双击复位）"></div>

  <!-- 右：译文面板 -->
  <aside class="panel" id="panel" data-view="trans">
    <div class="panel-tabs" id="panelTabs" role="tablist">
      <button class="ptab active" data-tab="trans" role="tab" aria-selected="true">翻译</button>
      <button class="ptab" data-tab="notes" role="tab" aria-selected="false">笔记<span class="ptab-n" id="notesCount" hidden>0</span></button>
    </div>

    <div class="notes-pane" id="notesPane" hidden></div>

    <div class="panel-src" id="srcBlock">
      <button class="src-head" id="srcToggle" aria-expanded="false">
        <span class="ic" data-icon="chevronRight"></span>
        <span class="src-label">原文</span>
        <span class="src-page" id="srcPage"></span>
        <span class="src-meta" id="srcMeta"></span>
      </button>
      <div class="src-body" id="srcBody" hidden></div>
    </div>

    <div class="panel-status" id="panelStatus" hidden></div>

    <div class="panel-main" id="panelMain">
      <div class="ph idle" id="phIdle">
        <svg viewBox="0 0 40 40" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M8 10h16M8 16h12M8 22h14"/>
          <path d="M24 26l5 5 7-9" opacity=".55"/>
        </svg>
        <p>在左侧选中文字，译文出现在这里</p>
        <p class="ph-sub">划词即翻 · 结果逐字输出</p>
      </div>

      <div class="ph loading" id="phLoading" hidden>
        <div class="skel skel-a"></div>
        <div class="skel skel-b"></div>
        <div class="skel skel-c"></div>
      </div>

      <div class="err-box" id="errBox" hidden>
        <div class="err-head"><span class="ic" data-icon="alert"></span><span>翻译失败</span></div>
        <div class="err-msg" id="errMsg"></div>
        <div class="err-detail" id="errDetail" hidden></div>
        <button class="btn small" id="btnRetry">重试</button>
      </div>

      <div class="mock-note" id="mockNote" hidden>
        <span class="ic" data-icon="zap"></span>
        <span>当前是<b>离线示例</b>，译文为占位内容。到<a href="#" id="mockGoSettings">设置</a>填入密钥即可使用真实翻译。</span>
      </div>

      <div class="result" id="result" hidden>
        <div class="result-text" id="resultText"></div>
        <span class="caret" id="caret" hidden></span>
      </div>
    </div>

    <div class="panel-foot">
      <div class="foot-meta" id="footMeta"></div>
      <div class="foot-actions">
        <button class="btn small ghost" id="btnPage" title="翻译当前整页"><span class="ic" data-icon="document"></span>翻译本页</button>
        <button class="btn small ghost" id="btnCopy" disabled title="复制译文"><span class="ic" data-icon="copy"></span>复制</button>
        <button class="btn small ghost" id="btnRetrans" disabled title="重新翻译（忽略缓存）"><span class="ic" data-icon="refresh"></span>重新翻译</button>
        <button class="btn small ghost danger" id="btnClear" disabled title="清空"><span class="ic" data-icon="trash"></span></button>
      </div>
    </div>
  </aside>
</main>

<!-- 拖放遮罩 -->
<div class="drop-overlay" id="dropOverlay" hidden>
  <div class="drop-box">松开以打开 PDF</div>
</div>

<!-- ───────────────────────── 设置弹窗 ───────────────────────── -->
<div class="modal-mask" id="setMask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="modal-head">
      <h2 id="setTitle">设置</h2>
      <button class="tb-btn icon-only" id="setClose" aria-label="关闭"><span class="ic" data-icon="x"></span></button>
    </div>

    <div class="modal-bar">
      <label class="field inline">
        <span class="f-label">当前服务商</span>
        <span class="select-wrap"><select id="setActive"></select><span class="select-caret ic" data-icon="chevronDown"></span></span>
      </label>
      <label class="field inline">
        <span class="f-label">源语言</span>
        <span class="select-wrap"><select id="setSrc"></select><span class="select-caret ic" data-icon="chevronDown"></span></span>
      </label>
      <label class="field inline">
        <span class="f-label">目标语言</span>
        <span class="select-wrap"><select id="setTgt"></select><span class="select-caret ic" data-icon="chevronDown"></span></span>
      </label>
      <div class="bar-spacer"></div>
      <div class="cache-box" id="cacheBox">缓存 –</div>
      <button class="btn small ghost" id="btnClearCache"><span class="ic" data-icon="trash"></span>清空翻译缓存</button>
    </div>

    <div class="modal-body" id="setBody">
      <div class="set-loading">正在读取配置…</div>
    </div>

    <div class="modal-foot">
      <div class="foot-hint" id="setHint"></div>
      <div class="foot-btns">
        <button class="btn ghost" id="setCancel">取消</button>
        <button class="btn primary" id="setSave">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast 容器 -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
